name: InviteX Playwright
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check production configuration and RSVP security invariants
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const ctx = {window:{}};
          vm.runInNewContext(fs.readFileSync('js/config.js','utf8'),ctx);
          const c = ctx.window.INVITEX_CONFIG;
          assert.match(c.SUPABASE_URL,/^https:\/\/[a-z0-9]+\.supabase\.co$/);
          assert.match(c.SUPABASE_ANON_KEY,/^sb_publishable_/);
          assert.match(c.PUBLIC_BASE_URL,/^https:\/\//);
          const sql = fs.readFileSync('supabase/schema.sql','utf8');
          const rpc = sql.split('create or replace function public.submit_rsvp(')[1].split('end $;')[0];
          assert.ok(rpc.includes("published is not null for update"));
          assert.ok(rpc.includes("v_status is null or"));
          assert.ok(rpc.includes("where id = existing.guest_id and invitation_id = inv.id"));
          assert.ok(rpc.includes("if not found then return jsonb_build_object('status','error','code','notFound');"));
          for(const table of ['invitations','guests','rsvps','invitation_secrets']){
            assert.match(sql,new RegExp('alter table public\\.'+table+'\\s+enable row level security','i'));
          }
          console.log('PASS static production configuration and RSVP security checks');
          JS
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        id: server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/invitex-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/invitex-server.log
          exit 1
      - name: Run demo-mode browser tests
        run: node tests/e2e.js
        env:
          BASE: http://localhost:8765/
      - name: Run Design Studio regression tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/design-studio.js
        env:
          BASE: http://localhost:8765/
      - name: Run AI Studio regression tests
        run: node tests/ai-studio.js
        env:
          BASE: http://localhost:8765/
      - name: Run reference image regression tests
        run: node tests/reference-image.js
        env:
          BASE: http://localhost:8765/
      - name: Run calligraphy regression tests
        run: node tests/calligraphy.js
        env:
          BASE: http://localhost:8765/
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: invitex-playwright-results
          path: |
            tests/e2e-output/
            /tmp/invitex-server.log
          retention-days: 14
